[package]
name = "paraxis"
authors = ["Glenn Wallace glennw-coding@proton.me"]
description = "A simple rock-solid mathematics library."
version = "0.9.1"
edition = "2024"
keywords = ["maths", "linear-algebra", "numpy"]
categories = ["mathematics"]
license = "MIT"
repository = "https://github.com/glennw-mt/paraxis"

[dev-dependencies]
macroquad = "0.4.14"
nalgebra = "0.34.1"
rayon = "1.11.0"
rand = { version = "0.10.0", features = ["thread_rng"] }

[dependencies]
bitvec = "1.0.1"
num-traits = "0.2.19"

