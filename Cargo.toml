[package]
name = "paraxis"
authors = ["Glenn Wallace glennw-coding@proton.me"]
description = "A simple rock-solid mathematics library."
version = "0.8.9"
edition = "2024"
keywords = ["maths", "gpu", "vectorization", "linear-algebra", "numpy"]
categories = ["mathematics"]
license = "MIT"
repository = "https://github.com/glennw-mt/paraxis"

[dependencies]
indexmap = "2.13.0"
rand = { version = "0.10.0", default-features = false, features = ["thread_rng"] }
rand_distr = { version = "0.6.0", default-features = false }

[dev-dependencies]
